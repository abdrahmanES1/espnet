# --- ARCHITECTURE CHANGES (Required by Source [1]) ---
adim: 512             # Paper uses 512 for 960h 
aheads: 8             # Paper uses 8 for 960h 
eunits: 2048
dunits: 2048
embed_aug_p: 60
# --- BATCHING (Required by Source [1]) ---
batch-size: 36        # Paper uses 36 for 960h (You had 64)
accum-grad: 4         # Accumulate gradients to stabilize the smaller batch size

# --- STANDARD PARAMETERS ---
backend: pytorch
maxlen-in: 512
maxlen-out: 150
dlayers: 6
dropout-rate: 0.1
elayers: 12
epochs: 120           # 960h requires longer training
grad-clip: 5
lsm-weight: 0.1
model-module: espnet.nets.pytorch_backend.e2e_asr_conformer:E2E
mtlalpha: 0.3         # Paper specifies 0.3 [3]
opt: noam
patience: 0
sortagrad: 0
transformer-attn-dropout-rate: 0.0
transformer-init: pytorch
transformer-input-layer: conv2d # CRITICAL: Triggers EmbedAug
transformer-length-normalized-loss: false
transformer-lr: 5.0   # Often reduced for larger datasets/accum-grad
transformer-warmup-steps: 25000
transformer-encoder-activation-type: swish
transformer-encoder-pos-enc-layer-type: rel_pos
transformer-encoder-selfattn-layer-type: rel_selfattn
macaron-style: true
use-cnn-module: true
cnn-module-kernel: 31
